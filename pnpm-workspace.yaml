# 让 apps/desktop 成为独立的工作区根，避免 pnpm 向上找到仓库根的
# pnpm-workspace.yaml（那里是单包工作区 packages: ['.']）。
# 这样桌面端的依赖与仓库根的 API 依赖互不干扰。
packages:
  - '.'

# pnpm 11 默认拦截依赖的构建脚本，必须显式放行：
#  - electron:  postinstall 负责下载 Electron 运行时二进制
#  - esbuild:   postinstall 负责落盘平台原生二进制（vite 依赖它）
#  - electron-winstaller: 仅打包 Windows 安装器时用到，留着不影响
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
